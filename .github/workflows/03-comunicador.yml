name: Comunicador de la Legion

on:
  workflow_dispatch:
    inputs: 
        villano:
            description: '¿Qué villano envía el mensaje?'
            required: true
            type: choice
            options:
                - Lex Luthor
                - Brainiac
                - Darkseid
                - Joker
                - Sinestro

        mensaje:
            description: 'Mensaje para el consejo'
            required: true
            default: 'La mísion fue un exito'
            type: string

        cow-character:
            description: 'Caracter de la vaca'
            required: true
            default: 'eyes'
            type: choice
            options:
                - eyes
                - tux
                - dragon
                - ghostbusters

        prioridad:
            description: 'Nivel de prioridad'
            required: true
            type: choice
            options:
                - 🟢 All good!
                - 🟡 Alta
                - 🔴 Crítica

jobs:
  Transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay
            
      - name: Imprimir inputs
        run: |
            echo "================================"
            echo "    Transmisión interceptada"
            echo "================================"
            echo ""
            echo "De ${{inputs.villano}}"
            echo ""
            echo "Fecha: $(date -u +"%d/%m/%Y %H:%M UTC")"
            echo "---- Mensaje ----"
            cowsay -f "${{inputs.cow-character}}" "${{inputs.mensaje}}"
            echo "--- ${{inputs.villano}}"
            echo "..."
