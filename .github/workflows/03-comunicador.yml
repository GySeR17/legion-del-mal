name: Comunicador de la Legion

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs: 
        villano:
            description: '¿Qué villano envía el mensaje?'
            required: true
            type: choice
            options:
                - Lex Luthor
                - Brainiac
                - Darkseid
                - Joker
                - Sinestro

        mensaje:
            description: 'Mensaje para el consejo'
            required: true
            default: 'La mísion fue un exito'
            type: string

        prioridad:
            description: 'Nivel de prioridad'
            required: true
            type: choice
            options:
                - 🟢 All good!
                - 🟡 Alta
                - 🔴 Crítica

jobs:
  Transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
